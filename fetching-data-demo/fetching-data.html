<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Untitled</title>
    <style>
      div {
        width: 100vw;
        height: 100vh;
        position: absolute;
        
      }
      img {
        width: 400px;
      }
    </style>
  </head>
  <body>
    <div id="body">
      
    </div>
    <script>

      async function setup () {
        // fetch data from the "Dog CEO" REST API
        const url = 'https://dog.ceo/api/breed/borzoi/images/random'
        const res = await fetch(url)
        const data = await res.json()
        // press F12 to open console (fn + F12 on mac)
        console.log(data)
        // create an <img> and add it to the pag
        let images = document.getElementById("body");
        const img = document.createElement("img");
        img.src = data.message;
        images.appendChild(img);
        
      }
      window.addEventListener('load', setup);
      window.addEventListener('click', setup);
      

    </script>
  </body>
</html>
